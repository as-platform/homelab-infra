---
- name: "Create K3s configuration directory"
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: "Configure K3s via template"
  ansible.builtin.template:
    src: config.yaml
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: "Restart k3s"

- name: "Download K3s installation script"
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: "Install K3s using official script"
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  args:
    creates: /usr/local/bin/k3s

- name: "Ensure local .kube directory exists"
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: "Wait for node to be Ready"
  ansible.builtin.command: /usr/local/bin/kubectl get node {{ ansible_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: k3s_node_status
  until: k3s_node_status.stdout == "True"
  retries: 20
  delay: 5
  changed_when: false

- name: "Read K3s kubeconfig from server"
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  no_log: true
  register: k3s_slurp_config

- name: "Build kubeconfig with context name"
  vars:
    k3s_main_config: "{{ k3s_slurp_config.content | b64decode | from_yaml }}"
  ansible.builtin.set_fact:
    k3s_modified_config: >-
      {{
        k3s_main_config | combine({
          'current-context': '',
          'clusters': [
            k3s_main_config.clusters[0] | combine({
              'name': k3s_context_name,
              'cluster': k3s_main_config.clusters[0].cluster | combine({
                'server': 'https://' ~ ansible_host ~ ':6443'
              })
            })
          ],
          'users': [ k3s_main_config.users[0] | combine({'name': k3s_context_name}) ],
          'contexts': [
            k3s_main_config.contexts[0] | combine({
              'name': k3s_context_name,
              'context': k3s_main_config.contexts[0].context | combine({
                'cluster': k3s_context_name,
                'user': k3s_context_name
              })
            })
          ]
        }, recursive=True)
      }}
  no_log: true

- name: "Save modified kubeconfig to Mac"
  ansible.builtin.copy:
    content: "{{ k3s_modified_config | to_nice_yaml(indent=2) }}"
    dest: "{{ lookup('env', 'HOME') }}/.kube/config-k3s"
    mode: "0600"
  no_log: true
  delegate_to: localhost
  become: false

- name: "Merge K3s kubeconfig into main kubeconfig"
  ansible.builtin.command: kubectl config view --flatten
  environment:
    KUBECONFIG: "{{ lookup('env', 'HOME') }}/.kube/config-k3s:{{ lookup('env', 'HOME') }}/.kube/config"
  register: k3s_merged_config
  changed_when: false
  no_log: true
  delegate_to: localhost
  become: false

- name: "Write merged kubeconfig with backup"
  ansible.builtin.copy:
    content: "{{ k3s_merged_config.stdout }}\n"
    dest: "{{ lookup('env', 'HOME') }}/.kube/config"
    mode: "0600"
    backup: true
  no_log: true
  delegate_to: localhost
  become: false
