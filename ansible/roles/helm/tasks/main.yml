---
- name: "Check current Helm version"
  ansible.builtin.command: "/usr/local/bin/helm version --short"
  register: helm_current_version_check
  failed_when: false
  changed_when: false

- name: "Install Helm if version mismatch or not installed"
  when: >
    helm_current_version_check.rc != 0 or
    not (helm_current_version_check.stdout is defined and helm_current_version_check.stdout.startswith(helm_version))

  block:
    - name: "Download Helm installation archive"
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
        checksum: "sha256:https://get.helm.sh/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz.sha256sum"
        mode: "0644"

    - name: "Unpacking and install Helm into /usr/local/bin"
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
        dest: "/usr/local/bin"
        remote_src: true
        mode: "0755"
        extra_opts:
          - "--strip-components=1"
          - "linux-{{ helm_arch }}/helm"

    - name: "Clear useless archive"
      ansible.builtin.file:
        path: "/tmp/helm-{{ helm_version }}-linux-{{ helm_arch }}.tar.gz"
        state: absent

- name: "Verify final Helm version"
  ansible.builtin.command: "/usr/local/bin/helm version --short"
  register: helm_final_version
  changed_when: false

- name: "Print Helm version"
  ansible.builtin.debug:
    msg: "{{ helm_final_version.stdout }}"
